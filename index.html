<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>my snowglobe for today</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <h1>my snowglobe for today</h1>
            <p class="tagline">shake it for a little winter kindness or a glimpse ahead</p>
        </header>
        <main>
            <section class="globe-card">
                <div class="globe" id="globe">
                    <div class="snowflakes" aria-hidden="true">
                        <span class="snowflakes">❄</span>
                        <span class="snowflakes">❅</span>
                        <span class="snowflakes">❆</span>
                        <span class="snowflakes"> •</span>
                        <span class="snowflakes">❄</span>
                    </div>
                    <img class="scene" src="snowglobe.png" alt="a snowglobe scene" />
                </div>
                <div class="button-group">
                    <button id="shake-kindness">shake the globe for kindness</button>
                    <button id="shake-fortune" class="btn-secondary">shake for fortune</button>
                </div>
                <p class="message" id="message">press the button and see what settles</p>
            </section>
        </main>
    <footer>
        <p>made by me, in the snow</p>
    </footer>
    <script src="script.js"></script>
    </body>
</html>
